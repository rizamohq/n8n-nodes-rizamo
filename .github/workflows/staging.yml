# Runs the built nodes against Rizamo's staging API (test/staging.cjs): reads, an upload, drafts it deletes again.
# Needs the repository secret RIZAMO_STAGING_API_KEY, an API key made on app-staging.rizamo.com under Developers.
name: Staging check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Build
        run: 'npm run build'

      - name: Check against staging
        run: 'node test/staging.cjs'
        env:
          RIZAMO_API_KEY: ${{ secrets.RIZAMO_STAGING_API_KEY }}
          RIZAMO_API_URL: https://api-staging.rizamo.com/v1
